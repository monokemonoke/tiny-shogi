<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>棋譜解説 - Tiny 将棋</title>
    <meta property="og:title" content="棋譜解説 - Tiny 将棋">
    <meta property="og:description" content="Tiny 将棋の棋譜を完全解析DBと局面差分で振り返ります。">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        :root {
            --ink: #3f2d25;
            --sub-ink: #6d574a;
            --panel: rgba(255, 250, 240, 0.88);
            --line: rgba(104, 72, 45, 0.22);
            --accent: #f28c18;
            --accent-strong: #dc5b1f;
            --good: #5c9b4a;
            --green-soft: rgba(103, 151, 79, 0.14);
            --shadow: 0 22px 52px rgba(34, 22, 13, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #14100d;
            color: var(--ink);
            font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        #board-root {
            position: fixed;
            inset: 0;
        }

        #explain-shell {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        #explain-panel {
            position: absolute;
            top: 22px;
            bottom: 112px;
            left: 22px;
            width: clamp(320px, 27vw, 430px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 18px 12px;
        }

        .panel-header h1 {
            margin: 0;
            font-size: 1.48rem;
            line-height: 1;
            color: var(--ink);
            letter-spacing: 0;
        }

        .back-link {
            flex-shrink: 0;
            color: var(--ink);
            text-decoration: none;
            border: 1px solid rgba(79, 50, 31, 0.34);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 0.88rem;
            background: rgba(255, 255, 255, 0.42);
        }

        .back-link:hover {
            border-color: var(--accent);
            color: var(--accent-strong);
        }

        .panel-content {
            min-height: 0;
            overflow-y: auto;
            padding: 10px 18px 18px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 0.92rem;
            color: var(--sub-ink);
            line-height: 1.45;
        }

        .status::before {
            content: "";
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--good);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
        }

        .selected-detail {
            margin-bottom: 18px;
            padding: 14px 16px;
            border: 1px solid rgba(242, 140, 24, 0.55);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(255, 248, 225, 0.96), rgba(255, 255, 255, 0.78));
            box-shadow: 0 12px 26px rgba(157, 93, 17, 0.12);
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .selected-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }

        .selected-title {
            font-size: 1.18rem;
            font-weight: 700;
            color: var(--ink);
        }

        .bad-badge,
        .neutral-badge,
        .severity-badge {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1;
        }

        .bad-badge {
            color: var(--accent-strong);
            background: rgba(255, 167, 38, 0.24);
        }

        .neutral-badge {
            color: var(--good);
            background: var(--green-soft);
        }

        .section-title {
            margin: 0 0 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--ink);
        }

        .section-title.compact {
            margin-top: 0;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .explain-item,
        .move-item {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--ink);
            cursor: pointer;
            font: inherit;
        }

        .explain-item {
            width: 100%;
            padding: 12px 14px;
            text-align: left;
        }

        .explain-item:hover,
        .explain-item.is-selected {
            border-color: var(--accent);
            background: rgba(255, 246, 224, 0.96);
        }

        .explain-item.is-selected {
            box-shadow: inset 4px 0 0 var(--accent);
        }

        .item-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .item-title::before {
            content: "";
            width: 11px;
            height: 11px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: var(--accent);
        }

        .item-message {
            display: block;
            padding-left: 19px;
            font-size: 0.86rem;
            line-height: 1.45;
            color: var(--sub-ink);
        }

        .empty-card {
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.56);
            color: var(--sub-ink);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        #analysis-card {
            position: absolute;
            top: 32vh;
            right: 28px;
            width: clamp(300px, 22vw, 390px);
            padding: 18px 18px 16px;
            pointer-events: auto;
        }

        .analysis-card-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-weight: 700;
            font-size: 1.04rem;
        }

        .issue-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: #fff;
            background: var(--accent-strong);
            font-weight: 700;
        }

        .issue-summary {
            color: var(--sub-ink);
            font-size: 0.94rem;
            line-height: 1.58;
        }

        .score-shift {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 14px;
            color: var(--sub-ink);
            font-weight: 700;
        }

        .score-gap-value {
            color: var(--accent-strong);
            font-size: 2rem;
            line-height: 1;
        }

        .divider {
            height: 1px;
            margin: 14px 0;
            background: var(--line);
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .feature-item {
            padding: 10px 12px;
            border: 1px solid rgba(104, 72, 45, 0.14);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.58);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .feature-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .severity-badge {
            color: #fff;
            background: var(--good);
        }

        .severity-badge.high {
            background: var(--accent-strong);
        }

        .severity-badge.medium {
            background: #d08a23;
        }

        #timeline-bar {
            position: absolute;
            right: 32px;
            bottom: 18px;
            left: 32px;
            min-height: 86px;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            padding: 14px 20px;
            pointer-events: auto;
        }

        .timeline-label {
            padding-right: 18px;
            border-right: 1px solid var(--line);
            font-weight: 700;
            white-space: nowrap;
        }

        .timeline-list {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            overflow-x: auto;
            overscroll-behavior-x: contain;
            padding: 2px 0 8px;
        }

        .timeline-list::before {
            content: "";
            width: 4px;
            height: 4px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: rgba(63, 45, 37, 0.45);
        }

        .move-item {
            min-width: 112px;
            height: 56px;
            padding: 7px 12px;
            text-align: left;
            flex: 0 0 auto;
        }

        .move-item:hover {
            border-color: rgba(242, 140, 24, 0.7);
        }

        .move-item.is-selected {
            border-color: var(--accent);
            background: rgba(255, 246, 224, 0.96);
            color: var(--ink);
        }

        .move-item.has-explanation:not(.is-selected) {
            border-color: rgba(242, 140, 24, 0.55);
        }

        .move-number {
            display: block;
            color: var(--accent-strong);
            font-size: 0.78rem;
            line-height: 1;
        }

        .move-label {
            display: block;
            margin-top: 5px;
            font-weight: 700;
            white-space: nowrap;
        }

        .timeline-controls {
            display: flex;
            gap: 10px;
        }

        .round-button {
            width: 48px;
            height: 48px;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.72);
            color: var(--ink);
            cursor: pointer;
            font-size: 1.65rem;
            line-height: 1;
        }

        .round-button:disabled {
            cursor: default;
            opacity: 0.38;
        }

        .piece-text {
            font-family: "HiraMinProN-W6", "Hiragino Mincho ProN", "Yu Mincho", serif;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            user-select: none;
            font-size: 150px;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            text-shadow: 0px 0px 2px rgba(0, 0, 0, 0.1);
        }

        .promoted-text {
            color: #b71c1c;
        }

        @media (max-width: 900px), (max-aspect-ratio: 9/10) {
            #explain-shell {
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                gap: 10px;
                padding: 12px;
            }

            #analysis-card,
            #explain-panel,
            #timeline-bar {
                position: static;
                width: auto;
            }

            #analysis-card {
                max-height: 26vh;
                overflow-y: auto;
            }

            #explain-panel {
                max-height: 36vh;
            }

            #timeline-bar {
                min-height: 78px;
                grid-template-columns: minmax(0, 1fr) auto;
                padding: 12px;
            }

            .timeline-label {
                display: none;
            }
        }

        @media (max-width: 560px) {
            #analysis-card {
                display: none;
            }

            .panel-header h1 {
                font-size: 1.25rem;
            }

            .move-item {
                min-width: 96px;
            }

            .round-button {
                width: 42px;
                height: 42px;
            }
        }
    </style>
</head>

<body>
    <div id="board-root"></div>
    <div id="explain-shell">
        <aside id="explain-panel" class="glass-panel">
            <div class="panel-header">
                <h1>棋譜解説</h1>
                <a class="back-link" href="game.html">対局へ</a>
            </div>
            <div class="panel-content">
                <div id="status" class="status">棋譜を読み込み中...</div>
                <div id="selected-detail" class="selected-detail"></div>

                <div class="section-title">悪手一覧</div>
                <div id="explanation-list" class="item-list"></div>
            </div>
        </aside>

        <aside id="analysis-card" class="glass-panel">
            <div class="analysis-card-heading">
                <span class="issue-icon">!</span>
                <span>問題点</span>
            </div>
            <div id="issue-summary" class="issue-summary">棋譜を解析すると、選択中の手の問題点を表示します。</div>
            <div id="score-gap" class="score-shift"></div>
            <div class="divider"></div>
            <div class="section-title compact">見直すポイント</div>
            <div id="feature-list" class="feature-list"></div>
        </aside>

        <nav id="timeline-bar" class="glass-panel" aria-label="棋譜の手順">
            <span class="timeline-label">手順</span>
            <div id="move-list" class="timeline-list"></div>
            <div class="timeline-controls">
                <button id="previous-move" class="round-button" type="button" aria-label="前の手">‹</button>
                <button id="next-move" class="round-button" type="button" aria-label="次の手">›</button>
            </div>
        </nav>
    </div>
    <script type="module" src="./explain.ts"></script>
</body>

</html>
