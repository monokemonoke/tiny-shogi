<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Board Editor - Tiny 将棋</title>
    <meta property="og:title" content="Board Editor - Tiny 将棋">
    <meta property="og:description" content="Tiny将棋の盤面作成ツール">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Tiny 将棋">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:image" content="/ogp.webp">
    <meta name="twitter:image" content="/ogp.webp">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="prefetch" href="index.html">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #ui-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            color: #4E342E;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            border: 1px solid #D7CCC8;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            pointer-events: auto;
            width: 280px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            cursor: pointer;
            background: rgba(109, 76, 65, 0.05);
            border-radius: 8px 8px 0 0;
            border-bottom: 1px solid #D7CCC8;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn {
            font-size: 0.8rem;
            color: #6D4C41;
            text-decoration: none;
            border: 1px solid #6D4C41;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: auto;
            background: transparent;
        }

        .back-btn:hover {
            color: #fff;
            background: #6D4C41;
        }

        .ui-header h1 {
            margin: 0;
            font-size: 1.1rem;
            color: #4E342E;
            pointer-events: none;
        }

        #toggle-icon {
            font-size: 1.2rem;
            color: #8D6E63;
            transition: transform 0.3s;
        }

        #ui-container.minimized .ui-header {
            border-radius: 8px;
            border-bottom: none;
        }

        #ui-container.minimized #toggle-icon {
            transform: rotate(180deg);
        }

        #ui-container.minimized #ui-content {
            display: none;
        }

        #ui-content {
            padding: 15px;
            opacity: 1;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Overlay Styles from game.html */
        .overlay-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #4E342E;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(2px);
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #D7CCC8;
            text-align: center;
            color: #4E342E;
            min-width: 280px;
            pointer-events: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-btn {
            padding: 10px 25px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        .btn-yes {
            background: #6D4C41;
            color: white;
        }

        .btn-yes:hover {
            background: #5D4037;
        }

        .btn-no {
            background: #A1887F;
            color: white;
        }

        .btn-no:hover {
            background: #8D6E63;
        }

        button.action-btn {
            background: #6D4C41;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background: #5D4037;
        }

        button.action-btn.active {
            background: #4E342E;
            border: 2px solid #fff;
        }

        /* 共通スタイル */
        .piece-text {
            font-family: "HiraMinProN-W6", "Hiragino Mincho ProN", "Yu Mincho", serif;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            user-select: none;
            font-size: 150px;
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            text-shadow: 0px 0px 2px rgba(0, 0, 0, 0.1);
        }

        .promoted-text {
            color: #b71c1c;
        }


        /* Mobile Styles */
        /* Sync with game.ts: (window.innerWidth < 768) || (window.innerWidth / window.innerHeight < 0.9) */
        @media (max-width: 768px),
        (aspect-ratio: 9/10),
        (max-aspect-ratio: 9/10) {
            #ui-container {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100%;
                border-radius: 12px 12px 0 0;
                border: none;
                border-top: 1px solid #D7CCC8;
                max-height: 50vh;
                box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
            }

            .ui-header {
                border-radius: 12px 12px 0 0;
            }

            /* Invert toggle icon logic for bottom sheet */
            /* Default (Expanded) should show Down arrow (to collapse) */
            /* Current char is ▲. Rotate 180 to get ▼ */
            #toggle-icon {
                transform: rotate(180deg);
            }

            /* Minimized (Collapsed) should show Up arrow (to expand) */
            #ui-container.minimized #toggle-icon {
                transform: rotate(0deg);
            }
        }
    </style>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/", "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js" } }
    </script>
</head>

<body>

    <div id="ui-container">
        <div class="ui-header" onclick="if(event.target.tagName!=='A') window.Main.toggleUI()">
            <div class="header-left">
                <a href="index.html" class="back-btn">戻る</a>
                <h1>Board Editor</h1>
            </div>
            <div id="toggle-icon">▲</div>
        </div>
        <div id="ui-content">
            <!-- モード切替 -->
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
                <button id="btn-mode-edit" class="action-btn" style="background:#5D4037; flex:1;"
                    onclick="window.Main.setMode('EDIT')">編集モード</button>
                <button id="btn-mode-play" class="action-btn" style="background:#A1887F; flex:1;"
                    onclick="window.Main.setMode('PLAY')">プレイ確認</button>
            </div>

            <!-- 編集操作 -->
            <div id="editor-controls">
                <button class="action-btn" onclick="window.Main.resetToInitial()">初期配置</button>
                <button class="action-btn" onclick="window.Main.clearBoard()">盤面クリア</button>
            </div>

            <div style="height: 15px;"></div>
            <div id="help-text" style="font-size:0.8rem; color:#888; margin-top:10px;">
                <b>[編集モード]</b><br>
                * 駒は自由に移動・配置できます。<br>
                * 枠外にドラッグすると削除されます。<br>
                * 駒箱（無限）から配置できます。
            </div>
        </div>
    </div>

    <!-- Modals (Simplified) -->
    <div id="promotion-overlay" class="overlay-bg" style="display:none;">
        <div class="modal-box">
            <h3 style="margin-top:0;">成りますか？</h3>
            <div style="display:flex; justify-content: center;">
                <button onclick="window.Main.resolvePromotion(true)" class="modal-btn btn-yes">成る</button>
                <button onclick="window.Main.resolvePromotion(false)" class="modal-btn btn-no">成らない</button>
            </div>
        </div>
    </div>

    <script type="module" src="./board_editor.ts"></script>
</body>

</html>
